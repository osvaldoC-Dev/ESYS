[project]
name = "esys-detector"
version = "0.1.0"
description = "ESYS core detector: secrets + PII detection and policy decisions"
requires-python = ">=3.11"

[project.scripts]
esys-watch = "esys_detector.watch:main"
esys-review = "esys_detector.review:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["esys_detector", "esys_detector.detectors"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["esys_detector", "eval"]
